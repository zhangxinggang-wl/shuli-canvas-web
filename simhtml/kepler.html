<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>开普勒第二定律</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<link rel="stylesheet" href="sim.css">
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="hud"></div></div>
  <aside id="panel"><div id="ctl"></div><div id="note"></div></aside>
</div>
<script>window.GW = window.GW || { live: {} };</script>
<script src="../core/physshapes.js"></script>
<script src="../vendor/katex/katex.min.js"></script>
<script src="sim.js"></script>
<script>
Sim.boot({
  key: 'anim_kepler2',
  title: '开普勒第二定律',
  sub: "行星沿椭圆轨道运行，相等时间内扫过的面积相等",
  params: ["kepE","kepSeg","kepPeriod"],
  period: 'kepPeriod',
  note: "近日点快、远日点慢；扫过的扇形面积用半透明色块标出。",
formula: String.raw`\dfrac{dA}{dt}=\dfrac{L}{2m}=\text{const}`,
  hud: (o, t) => 't = ' + t.toFixed(2) + ' s',
  speed: 0.8,
});
</script>
</body>
</html>
