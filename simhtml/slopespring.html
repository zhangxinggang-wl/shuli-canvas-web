<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>斜面弹簧振子</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<link rel="stylesheet" href="sim.css">
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="hud"></div></div>
  <aside id="panel"><div id="ctl"></div><div id="note"></div></aside>
</div>
<script>window.GW = window.GW || { live: {} };</script>
<script src="../core/physshapes.js"></script>
<script src="../vendor/katex/katex.min.js"></script>
<script src="sim.js"></script>
<script>
Sim.boot({
  key: 'anim_slope_spring',
  title: '斜面弹簧振子',
  sub: "斜面上的弹簧振子：倾角、周期、振幅都可调",
  params: ["spAngle","spPeriod","spAmp","spBoard","spBlock"],
  period: 'spPeriod',
  note: "沿斜面方向的回复力由弹簧提供，重力分量只改变平衡位置。",
formula: String.raw`T=2\pi\sqrt{\dfrac{m}{k}}\quad(\text{与倾角无关})`,
  hud: (o, t) => 't = ' + t.toFixed(2) + ' s',
  speed: 0.6,
});
</script>
</body>
</html>
