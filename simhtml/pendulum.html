<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>单摆</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<link rel="stylesheet" href="sim.css">
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="hud"></div></div>
  <aside id="panel"><div id="ctl"></div><div id="note"></div></aside>
</div>
<script>window.GW = window.GW || { live: {} };</script>
<script src="../core/physshapes.js"></script>
<script src="../vendor/katex/katex.min.js"></script>
<script src="sim.js"></script>
<script>
Sim.boot({
  key: 'anim_simple_pendulum',
  title: '单摆',
  sub: "摆长、摆角、重力加速度可调，按真实微分方程积分",
  params: ["pd_a0","pd_L","pd_g","pd_r"],
  integrate: true,
  note: "大摆角时周期会变长（不再是 2π√(L/g) 的近似）。",
formula: String.raw`\ddot\theta=-\dfrac{g}{L}\sin\theta`,
  hud: (o, t) => 't = ' + t.toFixed(2) + ' s',
  speed: 0.5,
});
</script>
</body>
</html>
