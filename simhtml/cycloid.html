<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旋轮线运动</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<link rel="stylesheet" href="sim.css">
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="hud"></div></div>
  <aside id="panel"><div id="ctl"></div><div id="note"></div></aside>
</div>
<script>window.GW = window.GW || { live: {} };</script>
<script src="../core/physshapes.js"></script>
<script src="../vendor/katex/katex.min.js"></script>
<script src="sim.js"></script>
<script>
Sim.boot({
  key: 'anim_cycloid',
  title: '旋轮线运动',
  sub: "滚动的圆上一点划出的轨迹，可调滚动速度、圆心角与半径",
  params: ["cyc_v0","cyc_ang","cyc_vd","cyc_T","cyc_B","cyc_sV","cyc_sFL","cyc_sFE"],
  noWrap: true,
  note: "轨迹只保留最近两圈；速度矢量与合力矢量跟着点走。",
formula: String.raw`\begin{aligned}x&=R(\theta-\sin\theta)\\ y&=R(1-\cos\theta)\end{aligned}`,
  hud: (o, t) => 't = ' + t.toFixed(2) + ' s',
  speed: 0.6,
});
</script>
</body>
</html>
