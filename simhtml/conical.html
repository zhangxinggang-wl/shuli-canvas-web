<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圆锥摆</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<link rel="stylesheet" href="sim.css">
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="hud"></div></div>
  <aside id="panel"><div id="ctl"></div><div id="note"></div></aside>
</div>
<script>window.GW = window.GW || { live: {} };</script>
<script src="../core/physshapes.js"></script>
<script src="../vendor/katex/katex.min.js"></script>
<script src="sim.js"></script>
<script>
Sim.boot({
  key: 'anim_conical_pendulum',
  title: '圆锥摆',
  sub: "摆球在水平面内做匀速圆周运动，摆长与摆角决定转速",
  params: ["conicalL","conicalTheta","animGravity"],
  noWrap: true,
  note: "角速度由 ω = √(g / (L·cosθ)) 决定，摆角越大转得越快。",
formula: String.raw`T=2\pi\sqrt{\dfrac{L\cos\theta}{g}}`,
  hud: (o, t) => 't = ' + t.toFixed(2) + ' s',
  speed: 0.6,
});
</script>
</body>
</html>
