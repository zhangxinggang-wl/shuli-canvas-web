<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>竖直弹簧振子</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<link rel="stylesheet" href="sim.css">
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="hud"></div></div>
  <aside id="panel"><div id="ctl"></div><div id="note"></div></aside>
</div>
<script>window.GW = window.GW || { live: {} };</script>
<script src="../core/physshapes.js"></script>
<script src="../vendor/katex/katex.min.js"></script>
<script src="sim.js"></script>
<script>
Sim.boot({
  key: 'anim_spring_vertical',
  title: '竖直弹簧振子',
  sub: "竖直悬挂的弹簧振子，可调周期、振幅、圈数与物块大小",
  params: ["vsPeriod","vsAmp","vsCoils","vsBlock"],
  period: 'vsPeriod',
  note: "平衡位置处速度最大、加速度为零；最高最低点速度为零。",
formula: String.raw`y=A\cos(\omega t)\qquad \omega=\dfrac{2\pi}{T}`,
  hud: (o, t) => 't = ' + t.toFixed(2) + ' s',
  speed: 0.6,
});
</script>
</body>
</html>
