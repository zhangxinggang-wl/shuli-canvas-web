<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圆弧轨道 · 特殊速度</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<link rel="stylesheet" href="sim.css">
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="hud"></div></div>
  <aside id="panel"><div id="ctl"></div><div id="note"></div></aside>
</div>
<script>window.GW = window.GW || { live: {} };</script>
<script src="../core/physshapes.js"></script>
<script src="../vendor/katex/katex.min.js"></script>
<script src="sim.js"></script>
<script>
Sim.boot({
  key: 'anim_slot_ball5',
  title: '圆弧轨道 · 特殊速度',
  sub: "比较不同初速度下小球能否通过最高点（临界速度演示）",
  params: ["sb5R","sb5r","sb5special","sb5k","sb5g"],
  integrate: true,
  note: "速度恰好等于临界值 √(gR) 时，球在最高点刚好不脱离轨道。",
formula: String.raw`v_{\text{临界}}=\sqrt{gR}`,
  hud: (o, t) => 't = ' + t.toFixed(2) + ' s',
  speed: 0.7,
});
</script>
</body>
</html>
